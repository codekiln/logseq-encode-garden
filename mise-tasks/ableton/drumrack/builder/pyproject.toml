[project]
name = "drumrack-builder"
version = "0.1.0"
description = "Local web tool for curating samples into Ableton Live Drum Racks"
requires-python = ">=3.15"
dependencies = [
  "fastapi>=0.120",
  "uvicorn>=0.38",
  "numpy>=2.3",
  # soundfile wraps libsndfile, which decodes WAV, AIFF, FLAC, OGG and MP3 without ffmpeg.
  "soundfile>=0.13",
  # scipy supplies the IIR filtering behind the BS.1770 (LUFS) loudness measurement.
  "scipy>=1.16",
]

[project.optional-dependencies]
# Launchpad audition needs a MIDI backend (rtmidi) and an audio output (PortAudio via
# sounddevice). Both ship binary wheels; keeping them optional lets the browser workflow
# run on a machine where either fails to install.
launchpad = ["mido>=1.3", "python-rtmidi>=1.5", "sounddevice>=0.5"]

[project.scripts]
drumrack-builder = "drumrack_builder.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
    "mypy>=1.18",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.15"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
